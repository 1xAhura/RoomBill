[package]
name = "roombill"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
jalali-rs = "0.1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.152"
tokio = { version = "1.0", features = ["full"] }
uuid = { version = "1.0", features = ["serde", "v4"] }
